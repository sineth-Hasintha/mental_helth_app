name: animated_calculator
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  camera: ^0.12.0
  google_mlkit_face_detection: ^0.13.2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  http: ^1.6.0

  # --- Firebase සහ Google Login පැකේජ් ටික ---
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1

  # --- Cloudinary පැකේජ් එක ---
  cloudinary_public: ^0.23.1 # <-- මේක අලුතින්ම ඇඩ් කළා (Google Login වලට අනිවාර්යයි)
  url_launcher: ^6.3.2 #for coll

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 # මෙය ලේටස්ට් වර්ෂන් එකට අප්ඩේට් කළා

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # මීට අමතරව වෙනත් images තියෙනවා නම් ඒවාත් මෙතනට පල්ලෙහායින් ඇඩ් කරන්න